<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SER AV — Admin</title>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #21262d;
  --surface3: #2d333b;
  --border: #30363d;
  --border2: #444c56;
  --text: #e6edf3;
  --text-muted: #8b949e;
  --blue: #4d9de0;
  --blue-dim: #1a2e45;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #e3b341;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ── LOGIN ─────────────────────────────── */
#login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.login-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 40px;
  width: 360px;
  text-align: center;
}
.login-logo { font-size: 28px; font-weight: 800; color: var(--blue); letter-spacing: 1px; margin-bottom: 6px; }
.login-logo span { color: #fff; }
.login-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 32px; }
.btn-google {
  width: 100%; padding: 11px; border-radius: 8px;
  background: #fff; color: #1f1f1f;
  border: none; cursor: pointer; font-size: 14px; font-weight: 500;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  margin-bottom: 16px; transition: background .15s;
}
.btn-google:hover { background: #f0f0f0; }
.btn-google svg { flex-shrink: 0; }
.divider {
  display: flex; align-items: center; gap: 10px;
  color: var(--text-muted); font-size: 12px; margin-bottom: 16px;
}
.divider::before, .divider::after {
  content: ""; flex: 1; height: 1px; background: var(--border);
}
.login-input {
  width: 100%; padding: 10px 12px; border-radius: 6px;
  background: var(--surface2); border: 1px solid var(--border2);
  color: var(--text); font-size: 14px; margin-bottom: 10px; outline: none;
}
.login-input:focus { border-color: var(--blue); }
.btn-email {
  width: 100%; padding: 11px; border-radius: 8px;
  background: var(--blue); color: #fff;
  border: none; cursor: pointer; font-size: 14px; font-weight: 500;
  transition: opacity .15s;
}
.btn-email:hover { opacity: .88; }
#login-error {
  color: var(--red); font-size: 12px; margin-top: 10px; min-height: 18px;
}

/* ── APP SHELL ──────────────────────────── */
#app { display: none; }

.app-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex; align-items: center; gap: 14px;
  position: sticky; top: 0; z-index: 100;
}
.app-logo img { height: 30px; width: auto; filter: brightness(0) invert(1); opacity: .92; }
.admin-badge {
  background: #2a1f0f; border: 1px solid var(--yellow);
  color: var(--yellow); font-size: 10px; font-weight: 700;
  letter-spacing: 1px; padding: 2px 8px; border-radius: 4px;
  text-transform: uppercase;
}
.header-spacer { flex: 1; }
#save-status { font-size: 12px; color: var(--text-muted); }
#save-status.saving { color: var(--yellow); }
#save-status.saved  { color: var(--green); }
#save-status.error  { color: var(--red); }
.user-info { font-size: 12px; color: var(--text-muted); }
.btn-signout {
  background: var(--surface2); border: 1px solid var(--border2);
  color: var(--text-muted); padding: 6px 12px; border-radius: 6px;
  cursor: pointer; font-size: 12px; transition: background .15s;
}
.btn-signout:hover { background: var(--surface3); color: var(--text); }

/* ── INIT PROMPT ─────────────────────────── */
#init-prompt {
  max-width: 560px; margin: 80px auto; text-align: center; padding: 0 24px;
}
#init-prompt h2 { font-size: 20px; margin-bottom: 10px; }
#init-prompt p { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; line-height: 1.6; }
.btn-init {
  background: var(--blue); color: #fff; border: none;
  padding: 12px 28px; border-radius: 8px; font-size: 14px;
  font-weight: 500; cursor: pointer; transition: opacity .15s;
}
.btn-init:hover { opacity: .88; }

/* ── EDITOR ──────────────────────────────── */
#editor { max-width: 860px; margin: 0 auto; padding: 24px 16px 80px; display: none; }

.phase-block {
  margin-bottom: 28px;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
.phase-header-bar {
  padding: 12px 16px;
  display: flex; align-items: center; gap: 10px;
  border-left: 4px solid;
}
.phase-icon-edit {
  font-size: 20px; cursor: pointer;
  background: none; border: none; padding: 2px;
}
.phase-title-edit {
  flex: 1; font-size: 16px; font-weight: 700;
  background: transparent; border: none; color: var(--text);
  border-bottom: 1px solid transparent;
  padding: 2px 4px; border-radius: 3px; outline: none;
  transition: border-color .15s, background .15s;
}
.phase-title-edit:hover { border-bottom-color: var(--border2); }
.phase-title-edit:focus { background: var(--surface2); border-bottom-color: var(--blue); }
.phase-step-count { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
.btn-add-step {
  background: var(--surface2); border: 1px solid var(--border2);
  color: var(--text-muted); padding: 5px 12px; border-radius: 5px;
  cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 5px;
  transition: background .15s, color .15s;
}
.btn-add-step:hover { background: var(--surface3); color: var(--text); }

/* ── STEPS LIST ──────────────────────────── */
.steps-list { border-top: 1px solid var(--border); }

.step-row {
  display: flex; align-items: flex-start; gap: 0;
  border-bottom: 1px solid var(--border);
  transition: background .15s;
  position: relative;
}
.step-row:last-child { border-bottom: none; }
.step-row.drag-over { background: var(--blue-dim); border-top: 2px solid var(--blue); }
.step-row.dragging { opacity: .4; }

.drag-handle {
  padding: 14px 10px 14px 14px;
  color: var(--border2); cursor: grab; font-size: 16px;
  user-select: none; flex-shrink: 0;
  display: flex; align-items: flex-start; padding-top: 16px;
}
.drag-handle:active { cursor: grabbing; }

.step-fields { flex: 1; padding: 10px 12px 10px 0; display: flex; flex-direction: column; gap: 6px; }

.step-top-row { display: flex; align-items: center; gap: 8px; }

.step-num-edit {
  font-size: 10px; font-weight: 700;
  font-family: "SF Mono", "Fira Code", monospace;
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text-muted); border-radius: 4px;
  padding: 3px 6px; width: 52px; text-align: center;
  outline: none; letter-spacing: .5px;
  transition: border-color .15s;
}
.step-num-edit:focus { border-color: var(--blue); color: var(--text); }

.step-label-edit {
  flex: 1; font-size: 11px; font-weight: 700; letter-spacing: .6px;
  text-transform: uppercase; color: var(--text-muted);
  background: transparent; border: none; border-bottom: 1px solid transparent;
  outline: none; padding: 2px 4px; border-radius: 3px;
  transition: border-color .15s, background .15s;
}
.step-label-edit:hover { border-bottom-color: var(--border2); }
.step-label-edit:focus { background: var(--surface2); border-bottom-color: var(--blue); color: var(--text); }

.step-text-edit {
  font-size: 14px; line-height: 1.55; color: var(--text);
  background: transparent; border: 1px solid transparent;
  border-radius: 5px; outline: none; padding: 4px 6px; width: 100%;
  resize: none; font-family: inherit; min-height: 22px;
  transition: border-color .15s, background .15s;
  overflow: hidden;
}
.step-text-edit:hover { border-color: var(--border2); }
.step-text-edit:focus { background: var(--surface2); border-color: var(--blue); }

.btn-delete-step {
  background: none; border: none; color: var(--border2);
  cursor: pointer; padding: 14px 14px 14px 6px;
  font-size: 15px; flex-shrink: 0; align-self: flex-start; margin-top: 8px;
  transition: color .15s;
}
.btn-delete-step:hover { color: var(--red); }

/* ── Day checkboxes ──────────────────────── */
.day-checks {
  display: flex; flex-direction: column; gap: 6px;
  padding: 14px 8px; align-self: flex-start; flex-shrink: 0;
  border-left: 1px solid var(--border);
}
.day-check-label {
  display: flex; align-items: center; gap: 5px;
  font-size: 10px; font-weight: 700; letter-spacing: .5px;
  cursor: pointer; user-select: none; white-space: nowrap;
}
.day-check-label.fri { color: #d97706; }
.day-check-label.sun { color: #60a5fa; }
.day-check-label input[type="checkbox"] { accent-color: var(--blue); cursor: pointer; width: 13px; height: 13px; }

/* ── DROP ZONE (add step) ─────────────────── */
.add-step-row {
  padding: 10px 16px;
  border-top: 1px solid var(--border);
  background: var(--surface);
}

/* ── SPINNER / LOADING ───────────────────── */
#loading-app {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 14px; color: var(--text-muted); font-size: 14px;
}
.spinner {
  width: 28px; height: 28px;
  border: 2px solid var(--border);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- Loading -->
<div id="loading-app">
  <div class="spinner"></div>
  Connecting…
</div>

<!-- Login -->
<div id="login-screen" style="display:none">
  <div class="login-card">
    <div style="text-align:center;margin-bottom:6px"><img src="SER_transparency-06.png" alt="S.E.R." style="height:48px;width:auto;filter:brightness(0) invert(1);opacity:.9"></div>
    <div class="login-sub">AV Checklist — Admin</div>

    <button class="btn-google" id="btn-google-login">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/></svg>
      Sign in with Google
    </button>

    <div class="divider">or</div>

    <input class="login-input" type="email"    id="login-email"    placeholder="Email address" autocomplete="email">
    <input class="login-input" type="password" id="login-password" placeholder="Password"      autocomplete="current-password">
    <button class="btn-email" id="btn-email-login">Sign in</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- App -->
<div id="app" style="display:none">
  <div class="app-header">
    <div class="app-logo"><img src="SER_transparency-06.png" alt="S.E.R."></div>
    <div class="admin-badge">Admin</div>
    <div class="header-spacer"></div>
    <span id="save-status"></span>
    <span class="user-info" id="user-email"></span>
    <button class="btn-signout" id="btn-signout">Sign out</button>
  </div>

  <div id="init-prompt" style="display:none">
    <h2>No checklist data yet</h2>
    <p>Firebase is empty. Click below to load the existing SER AV steps as a starting point. You can edit everything after.</p>
    <button class="btn-init" id="btn-init">Initialize checklist</button>
  </div>

  <div id="editor"></div>
</div>

<script type="module">
import { initializeApp }                       from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
import { getDatabase, ref, onValue, set }      from "https://www.gstatic.com/firebasejs/11.8.1/firebase-database.js";
import {
  getAuth, onAuthStateChanged,
  signInWithPopup, GoogleAuthProvider,
  signInWithEmailAndPassword, signOut

// ─── Config ─────────────────────────────────────────────────────────────────
const firebaseConfig = {
  apiKey:            "AIzaSyA8aTRigumgLdbmTZoTAfVwFQKunE4kZc4",
  authDomain:        "ser-av-mop.firebaseapp.com",
  databaseURL:       "https://ser-av-mop-default-rtdb.firebaseio.com",
  projectId:         "ser-av-mop",
  storageBucket:     "ser-av-mop.firebasestorage.app",
  messagingSenderId: "778596030835",
  appId:             "1:778596030835:web:11842d2de116e21bf18d06"
};

const fbApp = initializeApp(firebaseConfig);
const db    = getDatabase(fbApp);
const auth  = getAuth(fbApp);

// ─── Seed data (used only if Firebase is empty) ──────────────────────────────
const SEED_PHASES = [
  { id:"opening", title:"Opening Setup", color:"#1a56a0", icon:"🔌", order:0, steps:[
    { id:"o-1",  num:"O-1",  label:"💻 COMPUTER",       order:0,  text:"Verify COMPUTER is ON. Turn on monitors, mouse and keyboard." },
    { id:"o-2",  num:"O-2",  label:"💻 COMPUTER",       order:1,  text:"Press SPACE key to show PIN dialog box. Enter the 6-digit PIN (publication of The Spirits' Book in YYYYMM format)." },
    { id:"o-3",  num:"O-3",  label:"🔊 AUDIO & LIGHTS", order:2,  text:"MIXER ON: power button is on the rear-right of the mixer." },
    { id:"o-4",  num:"O-4",  label:"🔊 AUDIO & LIGHTS", order:3,  text:"SPEAKERS ON: press both speaker buttons on AV wall near mixer (left side). Watch for the speaker LEDs to turn ON." },
    { id:"o-5",  num:"O-5",  label:"🎬 PROJECTOR",      order:4,  text:"PROJECTOR ON: use white remote control. Press the power button (red) pointing towards the receiver on the AV area." },
    { id:"o-6",  num:"O-6",  label:"🎬 PROJECTOR",      order:5,  text:"PROJECTOR input: Press 8 on remote to switch — 1=PC AV, 2=Podium." },
    { id:"o-7",  num:"O-7",  label:"🔊 AUDIO & LIGHTS", order:6,  text:"Podium lights ON — switch is on the back wall (behind your back)." },
    { id:"o-8",  num:"O-8",  label:"💻 COMPUTER",       order:7,  text:"Open MS Edge internet browser. Navigate to the favorites bar and click on \"SER AV\"." },
    { id:"o-9",  num:"O-9",  label:"💻 COMPUTER",       order:8,  text:"Open PowerPoint — SLIDE MUSICA: Right-click the file → hover over \"Open\" → click \"Open in App\"." },
    { id:"o-10", num:"O-10", label:"💻 COMPUTER",       order:9,  text:"Repeat for file named \"avisos…\" — Right-click → hover over \"Open\" → click \"Open in App\"." }
  ]},
  { id:"alegria", title:"Alegria Cristã", color:"#2e7d32", icon:"🎵", order:1, steps:[
    { id:"ac-1", num:"AC-1", label:"💻 COMPUTER",       order:0, text:"Put SLIDE MUSICA in presentation mode." },
    { id:"ac-2", num:"AC-2", label:"💻 COMPUTER",       order:1, text:"The initial slide shows a menu of songs. Upon request by musicians, click on the song name to display it." },
    { id:"ac-3", num:"AC-3", label:"💻 COMPUTER",       order:2, text:"Click on the song name again to return to the menu. Pay attention for the next song request." },
    { id:"ac-4", num:"AC-4", label:"🔊 AUDIO & LIGHTS", order:3, text:"MIXER: Turn ON channels 1 through 6. Verify with musicians — they may not need all channels." }
  ]},
  { id:"avisos", title:"Avisos & Lecture", color:"#6a1b9a", icon:"📢", order:2, steps:[
    { id:"al-1",  num:"AL-1",  label:"🔊 AUDIO & LIGHTS",            order:0,  text:"MIXER — Channels 1–6: OFF. Podium / Channel 7: ON. PC Podium audio (if needed): Channels 9/10." },
    { id:"al-2",  num:"AL-2",  label:"🎬 PROJECTOR",                  order:1,  text:"PROJECTOR input: Press 8 on remote to switch from HDMI 1 (PC AV) to HDMI 2 (Podium) if presenter is at podium." },
    { id:"al-3",  num:"AL-3",  label:"💻 COMPUTER",                   order:2,  text:"Open Streamyard: In MS Edge favorites, click on Streamyard (already logged in)." },
    { id:"al-4",  num:"AL-4",  label:"💻 COMPUTER",                   order:3,  text:"Find the title of the presentation, then click \"Enter Studio\"." },
    { id:"al-5",  num:"AL-5",  label:"💻 COMPUTER",                   order:4,  text:"On the next screen, click \"Enter Studio\" again." },
    { id:"al-6",  num:"AL-6",  label:"💻 COMPUTER",                   order:5,  text:"Click Present → Choose screen → pick the projector screen." },
    { id:"al-7",  num:"AL-7",  label:"💻 COMPUTER",                   order:6,  text:"Put \"avisos…\" PowerPoint in presentation mode." },
    { id:"al-8",  num:"AL-8",  label:"💻 COMPUTER",                   order:7,  text:"Make sure the clicker/pointer is at the podium and is turned ON." },
    { id:"al-9",  num:"AL-9",  label:"💻 COMPUTER",                   order:8,  text:"⚠️ Click \"Go Live\" in Streamyard → confirm. NOTE: PowerPoint window must be active for the clicker to work." },
    { id:"al-10", num:"AL-10", label:"💻 COMPUTER",                   order:9,  text:"⚠️ Streamyard mic can be ON in ONE computer only." },
    { id:"al-11", num:"AL-11", label:"💻 COMPUTER — Presenter",       order:10, text:"Share the Streamyard guest link with the presenter." },
    { id:"al-12", num:"AL-12", label:"💻 PRESENTER'S COMPUTER",       order:11, text:"Presenter joins Streamyard and shares their screen. Microphone: OFF → turn ON only when playing video. Camera: OFF." },
    { id:"al-13", num:"AL-13", label:"💻 COMPUTER",                   order:12, text:"At the end of broadcast: click \"End Broadcast\" → confirm." }
  ]},
  { id:"passes", title:"Passes", color:"#00838f", icon:"🙏", order:3, steps:[
    { id:"p-1", num:"P-1", label:"🔊 AUDIO & LIGHTS", order:0, text:"MIXER: Turn off channels 1 through 10. Turn on Channel 11/12 (PC AV)." },
    { id:"p-2", num:"P-2", label:"🔊 AUDIO & LIGHTS", order:1, text:"LIGHTS: Blue lights ON. White ceiling lights OFF — see two buttons on AV wall near mixer (left side)." },
    { id:"p-3", num:"P-3", label:"💻 COMPUTER",       order:2, text:"Open Passe slides: On SharePoint SER AV, find file \"Passe…\" → Right-click → hover over → Open in App → Slideshow. Slides will run automatically." },
    { id:"p-4", num:"P-4", label:"💻 COMPUTER",       order:3, text:"Minimize all windows. On the Desktop, open the shortcut \"musicas passe\"." },
    { id:"p-5", num:"P-5", label:"💻 COMPUTER",       order:4, text:"Select all (Ctrl+A) → right-click → hover over → Play." },
    { id:"p-6", num:"P-6", label:"🔊 AUDIO & LIGHTS", order:5, text:"Adjust volume for Channel 11/12 as needed." }
  ]},
  { id:"closing", title:"Closing Setup", color:"#c62828", icon:"🔒", order:4, steps:[
    { id:"c-1", num:"C-1", label:"💻 COMPUTER",       order:0, text:"PC AV: Power OFF." },
    { id:"c-2", num:"C-2", label:"💻 COMPUTER",       order:1, text:"BONUS: Ensure entrance door is locked — check handle and deadbolt." },
    { id:"c-3", num:"C-3", label:"🔊 AUDIO & LIGHTS", order:2, text:"SPEAKERS OFF: press both buttons on AV wall near mixer. Observe their LEDs turn OFF." },
    { id:"c-4", num:"C-4", label:"🔊 AUDIO & LIGHTS", order:3, text:"MIXER: Channel 11/12 OFF." },
    { id:"c-5", num:"C-5", label:"🔊 AUDIO & LIGHTS", order:4, text:"MIXER OFF: switch button is on the rear-right." },
    { id:"c-6", num:"C-6", label:"🎬 PROJECTOR",      order:5, text:"PROJECTOR OFF: press power button, then press again to confirm." },
    { id:"c-7", num:"C-7", label:"🔊 AUDIO & LIGHTS", order:6, text:"Podium lights OFF — switch on back wall (behind your back)." },
    { id:"c-8", num:"C-8", label:"🔊 AUDIO & LIGHTS", order:7, text:"Blue lights OFF." }
  ]}
];

// ─── State ───────────────────────────────────────────────────────────────────
let phases = [];
let saveTimer = null;

// ─── Auth ────────────────────────────────────────────────────────────────────
onAuthStateChanged(auth, user => {
  document.getElementById("loading-app").style.display = "none";
  if (user) {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("user-email").textContent = user.displayName || user.email;
    loadData();
  } else {
    document.getElementById("login-screen").style.display = "flex";
    document.getElementById("app").style.display = "none";
  }
});

document.getElementById("btn-google-login").addEventListener("click", async () => {
  try {
    await signInWithPopup(auth, new GoogleAuthProvider());
  } catch (e) {
    document.getElementById("login-error").textContent = e.message;
  }
});

document.getElementById("btn-email-login").addEventListener("click", async () => {
  const email = document.getElementById("login-email").value.trim();
  const pass  = document.getElementById("login-password").value;
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (e) {
    document.getElementById("login-error").textContent = "Wrong email or password.";
  }
});

document.getElementById("btn-signout").addEventListener("click", () => signOut(auth));

// ─── Load data ───────────────────────────────────────────────────────────────
function loadData() {
  const phasesRef = ref(db, "phases");
  onValue(phasesRef, snapshot => {
    const raw = snapshot.val();
    if (!raw) {
      document.getElementById("init-prompt").style.display = "block";
      document.getElementById("editor").style.display = "none";
      return;
    }
    document.getElementById("init-prompt").style.display = "none";
    document.getElementById("editor").style.display = "block";

    phases = (Array.isArray(raw) ? raw : Object.values(raw))
      .sort((a,b) => (a.order??0)-(b.order??0))
      .map(p => ({
        ...p,
        steps: (Array.isArray(p.steps) ? p.steps : Object.values(p.steps||{}))
          .sort((a,b) => (a.order??0)-(b.order??0))
      }));

    renderEditor();
  }, { onlyOnce: false });
}

document.getElementById("btn-init").addEventListener("click", async () => {
  phases = JSON.parse(JSON.stringify(SEED_PHASES));
  await saveNow();
});

// ─── Save ────────────────────────────────────────────────────────────────────
function scheduleSave() {
  setSaveStatus("saving");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 1200);
}

async function saveNow() {
  // Re-assign order fields based on current array positions
  phases.forEach((p, pi) => {
    p.order = pi;
    p.steps.forEach((s, si) => { s.order = si; });
  });
  try {
    await set(ref(db, "phases"), phases);
    setSaveStatus("saved");
    setTimeout(() => setSaveStatus(""), 3000);
  } catch (e) {
    setSaveStatus("error");
  }
}

function setSaveStatus(state) {
  const el = document.getElementById("save-status");
  el.className = state;
  el.textContent = state === "saving" ? "Saving…"
                 : state === "saved"  ? "✓ Saved"
                 : state === "error"  ? "⚠ Save failed"
                 : "";
}

// ─── Render editor ────────────────────────────────────────────────────────────
function renderEditor() {
  const editor = document.getElementById("editor");
  editor.innerHTML = "";
  phases.forEach((phase, pi) => editor.appendChild(makePhaseBlock(phase, pi)));
}

function makePhaseBlock(phase, pi) {
  const block = document.createElement("div");
  block.className = "phase-block";
  block.dataset.pi = pi;

  // Header
  const bar = document.createElement("div");
  bar.className = "phase-header-bar";
  bar.style.background     = phase.color + "18";
  bar.style.borderLeftColor = phase.color;

  const iconBtn = document.createElement("button");
  iconBtn.className = "phase-icon-edit";
  iconBtn.title     = "Click to change icon";
  iconBtn.textContent = phase.icon;
  iconBtn.addEventListener("click", () => {
    const val = prompt("Enter new emoji icon:", phase.icon);
    if (val) { phase.icon = val.trim(); iconBtn.textContent = phase.icon; scheduleSave(); }
  });

  const titleInput = document.createElement("input");
  titleInput.className = "phase-title-edit";
  titleInput.value      = phase.title;
  titleInput.addEventListener("input", () => { phase.title = titleInput.value; scheduleSave(); });

  const countEl = document.createElement("span");
  countEl.className   = "phase-step-count";
  countEl.textContent = phase.steps.length + " steps";

  const addBtn = document.createElement("button");
  addBtn.className = "btn-add-step";
  addBtn.innerHTML  = "+ Add step";
  addBtn.addEventListener("click", () => {
    const newStep = {
      id:     "step-" + Date.now(),
      num:    "?",
      label:  "📝 LABEL",
      text:   "New step — click to edit",
      order:  phase.steps.length,
      friday: true,
      sunday: true
    };
    phase.steps.push(newStep);
    scheduleSave();
    // Re-render just this phase block
    const newBlock = makePhaseBlock(phase, pi);
    block.replaceWith(newBlock);
    // Focus the new step's text field
    const rows = newBlock.querySelectorAll(".step-text-edit");
    if (rows.length) { rows[rows.length-1].focus(); rows[rows.length-1].select(); }
  });

  bar.appendChild(iconBtn);
  bar.appendChild(titleInput);
  bar.appendChild(countEl);
  bar.appendChild(addBtn);
  block.appendChild(bar);

  // Steps list
  const list = document.createElement("div");
  list.className = "steps-list";
  phase.steps.forEach((step, si) => list.appendChild(makeStepRow(step, phase, pi, si, list, block)));
  block.appendChild(list);

  return block;
}

function makeStepRow(step, phase, pi, si, list, block) {
  const row = document.createElement("div");
  row.className     = "step-row";
  row.draggable     = true;
  row.dataset.si    = si;
  row.dataset.stepId = step.id;

  // Drag handle
  const handle = document.createElement("div");
  handle.className   = "drag-handle";
  handle.textContent = "⠿";
  handle.title       = "Drag to reorder";

  // Fields
  const fields = document.createElement("div");
  fields.className = "step-fields";

  const topRow = document.createElement("div");
  topRow.className = "step-top-row";

  const numInput = document.createElement("input");
  numInput.className   = "step-num-edit";
  numInput.value        = step.num;
  numInput.title        = "Step number/code";
  numInput.addEventListener("input", () => { step.num = numInput.value; scheduleSave(); });

  const labelInput = document.createElement("input");
  labelInput.className   = "step-label-edit";
  labelInput.value        = step.label;
  labelInput.placeholder  = "Category label";
  labelInput.addEventListener("input", () => { step.label = labelInput.value; scheduleSave(); });

  topRow.appendChild(numInput);
  topRow.appendChild(labelInput);

  const textArea = document.createElement("textarea");
  textArea.className    = "step-text-edit";
  textArea.value         = step.text;
  textArea.rows          = 1;
  textArea.placeholder   = "Step instructions…";
  autoResize(textArea);
  textArea.addEventListener("input", () => {
    step.text = textArea.value;
    autoResize(textArea);
    scheduleSave();
  });

  fields.appendChild(topRow);
  fields.appendChild(textArea);

  // Day checkboxes (Fri / Sun)
  const dayChecks = document.createElement("div");
  dayChecks.className = "day-checks";

  ["friday","sunday"].forEach(day => {
    const label = document.createElement("label");
    label.className = "day-check-label " + (day === "friday" ? "fri" : "sun");

    const cb = document.createElement("input");
    cb.type    = "checkbox";
    cb.checked = step[day] !== false; // default true if missing
    cb.addEventListener("change", () => {
      step[day] = cb.checked;
      scheduleSave();
    });

    label.appendChild(cb);
    label.appendChild(document.createTextNode(day === "friday" ? "Fri" : "Sun"));
    dayChecks.appendChild(label);
  });

  // Delete
  const delBtn = document.createElement("button");
  delBtn.className   = "btn-delete-step";
  delBtn.textContent = "✕";
  delBtn.title       = "Delete step";
  delBtn.addEventListener("click", () => {
    if (!confirm("Delete this step?")) return;
    phase.steps.splice(si, 1);
    scheduleSave();
    const newBlock = makePhaseBlock(phase, pi);
    block.replaceWith(newBlock);
  });

  row.appendChild(handle);
  row.appendChild(fields);
  row.appendChild(dayChecks);
  row.appendChild(delBtn);

  // ── Drag & drop ──
  let dragSrc = null;

  row.addEventListener("dragstart", e => {
    dragSrc = row;
    row.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
  });
  row.addEventListener("dragend", () => {
    row.classList.remove("dragging");
    list.querySelectorAll(".step-row").forEach(r => r.classList.remove("drag-over"));
  });
  row.addEventListener("dragover", e => {
    e.preventDefault();
    if (row !== dragSrc) row.classList.add("drag-over");
  });
  row.addEventListener("dragleave", () => row.classList.remove("drag-over"));
  row.addEventListener("drop", e => {
    e.preventDefault();
    row.classList.remove("drag-over");
    if (!dragSrc || dragSrc === row) return;

    const fromSi = parseInt(dragSrc.dataset.si);
    const toSi   = parseInt(row.dataset.si);

    // Reorder in data
    const [moved] = phase.steps.splice(fromSi, 1);
    phase.steps.splice(toSi, 0, moved);
    scheduleSave();

    // Re-render phase block
    const newBlock = makePhaseBlock(phase, pi);
    block.replaceWith(newBlock);
  });

  return row;
}

function autoResize(el) {
  el.style.height = "auto";
  el.style.height = el.scrollHeight + "px";
}
</script>
</body>
