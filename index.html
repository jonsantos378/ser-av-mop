<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SER AV — Method of Procedure</title>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #21262d;
  --border: #30363d;
  --text: #e6edf3;
  --text-muted: #8b949e;
  --done-bg: #0d1f12;
  --done-text: #6e9f77;
  --next-bg: #1a2640;
  --next-border: #2563eb;
  --check-green: #3fb950;
  --friday-color: #d97706;
  --sunday-color: #2563eb;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ── SERVICE SELECTOR ──────────────────── */
#service-screen {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  gap: 32px;
}
.service-logo { height: 52px; width: auto; filter: brightness(0) invert(1); opacity: .9; }
.service-heading {
  text-align: center;
}
.service-heading h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
.service-heading p  { font-size: 14px; color: var(--text-muted); }
.service-buttons {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  justify-content: center;
  width: 100%;
  max-width: 560px;
}
.service-btn {
  flex: 1; min-width: 200px;
  border: none; border-radius: 14px;
  padding: 36px 24px;
  cursor: pointer;
  display: flex; flex-direction: column;
  align-items: center; gap: 14px;
  transition: transform .15s, opacity .15s;
}
.service-btn:hover { transform: translateY(-3px); opacity: .92; }
.service-btn:active { transform: translateY(0); }
.service-btn-friday {
  background: linear-gradient(135deg, #92400e 0%, #b45309 100%);
  border: 1px solid #d97706;
}
.service-btn-sunday {
  background: linear-gradient(135deg, #1e3a6e 0%, #1d4ed8 100%);
  border: 1px solid #3b82f6;
}
.service-btn-icon { font-size: 36px; }
.service-btn-day  { font-size: 26px; font-weight: 800; color: #fff; letter-spacing: .5px; }
.service-btn-desc { font-size: 12px; color: rgba(255,255,255,.7); text-align: center; line-height: 1.5; }

/* ── APP ───────────────────────────────── */
#app { display: none; }

header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 14px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.ser-logo img { height: 32px; width: auto; filter: brightness(0) invert(1); opacity: .92; }
header h1 { font-size: 14px; font-weight: 500; color: var(--text-muted); flex: 1; }

/* Service badge in header */
.service-badge {
  font-size: 11px; font-weight: 700; letter-spacing: .6px;
  padding: 3px 10px; border-radius: 20px; text-transform: uppercase;
}
.service-badge.friday { background: #92400e22; border: 1px solid var(--friday-color); color: var(--friday-color); }
.service-badge.sunday { background: #1e3a6e22; border: 1px solid #3b82f6;             color: #60a5fa; }

.btn-change-service {
  background: none; border: none; color: var(--text-muted);
  font-size: 12px; cursor: pointer; padding: 4px 8px; border-radius: 5px;
  transition: color .15s;
}
.btn-change-service:hover { color: var(--text); }

#btn-reset-all {
  background: #21262d; border: 1px solid #444c56; color: #cdd9e5;
  padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
  transition: background .15s;
}
#btn-reset-all:hover { background: #2d333b; }

.global-progress {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 8px 24px; display: flex; align-items: center; gap: 12px;
  font-size: 12px; color: var(--text-muted);
}
.progress-bar-wrap { flex: 1; background: var(--surface2); border-radius: 4px; height: 6px; overflow: hidden; }
.progress-bar-fill { height: 100%; background: var(--check-green); border-radius: 4px; transition: width .3s ease; }
main { max-width: 820px; margin: 0 auto; padding: 24px 16px 80px; }

/* Loading */
#loading-msg {
  text-align: center; padding: 80px 24px;
  color: var(--text-muted); font-size: 15px;
}
.spinner {
  width: 28px; height: 28px;
  border: 2px solid var(--border); border-top-color: #4d9de0;
  border-radius: 50%; animation: spin .7s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Update banner */
#update-banner {
  display: none; position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%);
  background: #1a2640; border: 1px solid #2563eb; color: #93b4f0;
  padding: 10px 20px; border-radius: 8px; font-size: 13px; z-index: 200;
  animation: fadeIn .3s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateX(-50%) translateY(8px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}

/* Phases & steps */
.phase { margin-bottom: 32px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.phase-header {
  padding: 14px 20px; display: flex; align-items: center; gap: 10px;
  cursor: pointer; user-select: none;
}
.phase-icon  { font-size: 20px; }
.phase-title { flex: 1; font-size: 17px; font-weight: 700; letter-spacing: .3px; }
.phase-progress { font-size: 12px; opacity: .75; margin-right: 8px; }
.phase-bar-wrap { width: 80px; background: rgba(255,255,255,0.1); border-radius: 4px; height: 5px; overflow: hidden; margin-right: 10px; }
.phase-bar-fill { height: 100%; border-radius: 4px; transition: width .3s ease; }
.phase-reset-btn {
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.7); padding: 4px 10px; border-radius: 5px;
  cursor: pointer; font-size: 11px; transition: background .15s;
}
.phase-reset-btn:hover { background: rgba(255,255,255,0.15); }
.phase-chevron { font-size: 12px; opacity: .6; transition: transform .2s; }
.phase.collapsed .phase-chevron { transform: rotate(-90deg); }
.phase-body { border-top: 1px solid var(--border); }
.phase.collapsed .phase-body { display: none; }

.step {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 13px 20px; border-bottom: 1px solid var(--border);
  transition: background .2s, opacity .2s; cursor: pointer;
}
.step:last-child { border-bottom: none; }
.step:hover:not(.done) { background: var(--surface2); }
.step.done     { background: var(--done-bg); opacity: .6; }
.step.next-up  { background: var(--next-bg); border-left: 3px solid var(--next-border); }
.step-checkbox {
  width: 20px; height: 20px; min-width: 20px; border-radius: 50%;
  border: 2px solid #444c56; background: transparent;
  display: flex; align-items: center; justify-content: center;
  margin-top: 1px; transition: all .2s;
}
.step.done .step-checkbox    { background: var(--check-green); border-color: var(--check-green); }
.step-check-mark { display: none; color: #000; font-size: 11px; font-weight: 900; }
.step.done .step-check-mark  { display: block; }
.step.next-up .step-checkbox { border-color: var(--next-border); }
.step-content { flex: 1; min-width: 0; }
.step-label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.step-label { font-size: 10px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--text-muted); }
.step.done .step-label { color: #4a5a4e; }
.step-num {
  font-size: 10px; font-weight: 700;
  font-family: "SF Mono", "Fira Code", monospace;
  color: #555f6e; background: #1e242c; border: 1px solid #2d343d;
  border-radius: 4px; padding: 2px 6px; min-width: 38px; text-align: center;
  letter-spacing: .5px; transition: color .2s; white-space: nowrap;
}
.step.done .step-num   { color: #3a5a42; border-color: #2a3d30; }
.step.next-up .step-num { color: #5b8dee; border-color: #2a3f6e; background: #141e30; }
.step-text { font-size: 14px; line-height: 1.55; color: var(--text); }
.step.done .step-text  { color: var(--done-text); text-decoration: line-through; }
</style>
</head>
<body>

<!-- ── SERVICE SELECTOR ─────────────────────────────────── -->
<div id="service-screen">
  <img src="SER_transparency-06.png" alt="S.E.R." class="service-logo">
  <div class="service-heading">
    <h1>Audiovisual — Method of Procedure</h1>
    <p>Select today's service to load the correct checklist</p>
  </div>
  <div class="service-buttons">
    <button class="service-btn service-btn-friday" id="btn-friday">
      <div class="service-btn-icon">🌙</div>
      <div class="service-btn-day">Friday</div>
      <div class="service-btn-desc">No streaming · shorter setup</div>
    </button>
    <button class="service-btn service-btn-sunday" id="btn-sunday">
      <div class="service-btn-icon">☀️</div>
      <div class="service-btn-day">Sunday</div>
      <div class="service-btn-desc">Full service · includes streaming</div>
    </button>
  </div>
</div>

<!-- ── CHECKLIST APP ─────────────────────────────────────── -->
<div id="app">
  <header>
    <div class="ser-logo"><img src="SER_transparency-06.png" alt="S.E.R."></div>
    <h1>Audiovisual — Method of Procedure</h1>
    <span class="service-badge" id="service-badge"></span>
    <button class="btn-change-service" id="btn-change">↩ Change</button>
    <button id="btn-reset-all">↺ Reset All</button>
  </header>

  <div class="global-progress">
    <span id="global-label">Loading…</span>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="global-bar" style="width:0%"></div>
    </div>
  </div>

  <main id="main-content">
    <div id="loading-msg">
      <div class="spinner"></div>
      Loading checklist…
    </div>
  </main>
</div>

<div id="update-banner">⟳ Checklist updated by an editor</div>

<script type="module">
import { initializeApp }             from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-database.js";

const firebaseConfig = {
  apiKey:            "AIzaSyA8aTRigumgLdbmTZoTAfVwFQKunE4kZc4",
  authDomain:        "ser-av-mop.firebaseapp.com",
  databaseURL:       "https://ser-av-mop-default-rtdb.firebaseio.com",
  projectId:         "ser-av-mop",
  storageBucket:     "ser-av-mop.firebasestorage.app",
  messagingSenderId: "778596030835",
  appId:             "1:778596030835:web:11842d2de116e21bf18d06"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

// ── Session state ─────────────────────────────────────────
function getChecked() {
  try { return JSON.parse(localStorage.getItem("ser-av-checked") || "{}"); }
  catch { return {}; }
}
function setChecked(obj) { localStorage.setItem("ser-av-checked", JSON.stringify(obj)); }

let PHASES    = [];
let checked   = getChecked();
let service   = null;   // "friday" | "sunday"
let firstLoad = true;

// ── Service selector ──────────────────────────────────────
document.getElementById("btn-friday").addEventListener("click", () => startService("friday"));
document.getElementById("btn-sunday").addEventListener("click", () => startService("sunday"));
document.getElementById("btn-change").addEventListener("click", () => {
  service = null;
  document.getElementById("app").style.display = "none";
  document.getElementById("service-screen").style.display = "flex";
});

function startService(svc) {
  service = svc;
  document.getElementById("service-screen").style.display = "none";
  document.getElementById("app").style.display = "block";

  // Update badge
  const badge = document.getElementById("service-badge");
  badge.textContent = svc === "friday" ? "Friday" : "Sunday";
  badge.className   = "service-badge " + svc;

  // Render if data already loaded
  if (PHASES.length) renderAll();
}

// ── Firebase listener ─────────────────────────────────────
const phasesRef = ref(db, "phases");
onValue(phasesRef, snapshot => {
  const raw = snapshot.val();
  if (!raw) {
    document.getElementById("loading-msg").textContent =
      "No checklist data found. Ask an admin to publish the steps.";
    return;
  }

  PHASES = (Array.isArray(raw) ? raw : Object.values(raw))
    .sort((a,b) => (a.order??0)-(b.order??0))
    .map(p => ({
      ...p,
      steps: (Array.isArray(p.steps) ? p.steps : Object.values(p.steps||{}))
        .sort((a,b) => (a.order??0)-(b.order??0))
    }));

  if (!firstLoad) showUpdateBanner();
  firstLoad = false;

  if (service) renderAll();
});

// ── Filter steps by service ───────────────────────────────
// Missing friday/sunday field defaults to true (shows on both)
function stepVisibleFor(step, svc) {
  if (svc === "friday") return step.friday !== false;
  if (svc === "sunday") return step.sunday !== false;
  return true;
}

// ── Render ────────────────────────────────────────────────
function renderAll() {
  const main = document.getElementById("main-content");
  main.innerHTML = "";

  PHASES.forEach((phase, pi) => {
    const visibleSteps = phase.steps.filter(s => stepVisibleFor(s, service));
    if (!visibleSteps.length) return;
    main.appendChild(makePhaseEl(phase, visibleSteps, pi));
  });

  refreshAllStates();
}

function makePhaseEl(phase, visibleSteps, pi) {
  const phaseEl = document.createElement("div");
  phaseEl.className = "phase";
  phaseEl.dataset.pi = pi;

  const header = document.createElement("div");
  header.className = "phase-header";
  header.style.background  = phase.color + "22";
  header.style.borderLeft  = "4px solid " + phase.color;
  header.addEventListener("click", e => {
    if (!e.target.classList.contains("phase-reset-btn")) togglePhase(pi);
  });

  header.innerHTML = `
    <span class="phase-icon">${phase.icon}</span>
    <span class="phase-title">${phase.title}</span>
    <span class="phase-progress" id="pp-${pi}">0/${visibleSteps.length}</span>
    <div class="phase-bar-wrap">
      <div class="phase-bar-fill" id="pb-${pi}" style="background:${phase.color};width:0%"></div>
    </div>
    <button class="phase-reset-btn" data-pi="${pi}">↺ Reset</button>
    <span class="phase-chevron">▾</span>
  `;
  header.querySelector(".phase-reset-btn").addEventListener("click", e => {
    e.stopPropagation(); resetPhase(visibleSteps);
  });

  const body = document.createElement("div");
  body.className = "phase-body";
  visibleSteps.forEach((step, si) => body.appendChild(makeStepEl(step, pi, si, visibleSteps)));

  phaseEl.appendChild(header);
  phaseEl.appendChild(body);
  return phaseEl;
}

function makeStepEl(step, pi, si, visibleSteps) {
  const el = document.createElement("div");
  el.className = "step";
  el.dataset.stepId = step.id;
  el.addEventListener("click", () => {
    checked[step.id] = !checked[step.id];
    setChecked(checked);
    refreshAllStates();
  });
  el.innerHTML = `
    <div class="step-checkbox"><span class="step-check-mark">✓</span></div>
    <div class="step-content">
      <div class="step-label-row">
        <div class="step-label">${step.label}</div>
        <div class="step-num">${step.num}</div>
      </div>
      <div class="step-text">${step.text}</div>
    </div>
  `;
  return el;
}

// ── State helpers ─────────────────────────────────────────
function refreshAllStates() {
  let totalDone = 0, totalSteps = 0;

  PHASES.forEach((phase, pi) => {
    const visibleSteps = phase.steps.filter(s => stepVisibleFor(s, service));
    if (!visibleSteps.length) return;

    let phaseDone = 0;
    visibleSteps.forEach((step, si) => {
      const el = document.querySelector(`.step[data-step-id="${step.id}"]`);
      if (!el) return;
      const done = !!checked[step.id];
      const next = !done && isNextVisible(si, visibleSteps);
      el.className = "step" + (done ? " done" : "") + (next ? " next-up" : "");
      if (done) phaseDone++;
    });

    const pp = document.getElementById("pp-" + pi);
    const pb = document.getElementById("pb-" + pi);
    if (pp) pp.textContent = phaseDone + "/" + visibleSteps.length;
    if (pb) pb.style.width = Math.round(phaseDone / visibleSteps.length * 100) + "%";

    totalDone  += phaseDone;
    totalSteps += visibleSteps.length;
  });

  document.getElementById("global-bar").style.width =
    totalSteps ? Math.round(totalDone / totalSteps * 100) + "%" : "0%";
  document.getElementById("global-label").textContent =
    totalDone + " / " + totalSteps + " steps complete";
}

function isNextVisible(targetSi, visibleSteps) {
  for (let si = 0; si < visibleSteps.length; si++) {
    if (!checked[visibleSteps[si].id]) return si === targetSi;
  }
  return false;
}

function togglePhase(pi) {
  const el = document.querySelector(`.phase[data-pi="${pi}"]`);
  if (el) el.classList.toggle("collapsed");
}

function resetPhase(visibleSteps) {
  visibleSteps.forEach(s => { checked[s.id] = false; });
  setChecked(checked);
  refreshAllStates();
}

document.getElementById("btn-reset-all").addEventListener("click", () => {
  PHASES.forEach(p => p.steps.forEach(s => { checked[s.id] = false; }));
  setChecked(checked);
  refreshAllStates();
});

// ── Update banner ─────────────────────────────────────────
function showUpdateBanner() {
  const b = document.getElementById("update-banner");
  b.style.display = "block";
  clearTimeout(b._t);
  b._t = setTimeout(() => { b.style.display = "none"; }, 4000);
}
</script>
</body>
</html>
